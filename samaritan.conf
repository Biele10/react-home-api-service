<VirtualHost *:80>
    ServerName samaritan.local

    DocumentRoot /var/www/Samaritan/public_html

    ErrorLog /var/log/apache2/samaritan_error.log
    CustomLog /var/log/apache2/samaritan_access.log combined

    <Directory /var/www/Samaritan/public_html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Send API requests to PHP/FastRoute
        RewriteRule ^api(?:/.*)?$ index.php [QSA,L]

        # React SPA fallback
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>